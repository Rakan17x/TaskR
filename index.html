<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="إنجاز">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEF0F3">
<title>إنجاز</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#EEF0F3;--pn:#FAFBFC;--tx:#0B1B2B;--mu:#5E6F80;--ln:#CAD3DC;--ac:#0A57D6;--ok:#0C9A62;--wn:#C26A00;--cr:#CC2A41;--on:#fff;--gr:rgba(10,87,214,.06);--gl:none;--mo:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
body{margin:0;color:var(--tx);background-color:var(--bg);background-image:linear-gradient(var(--gr) 1px,transparent 1px),linear-gradient(90deg,var(--gr) 1px,transparent 1px),radial-gradient(700px 420px at 0% 0%,rgba(176,200,255,.55),transparent),radial-gradient(600px 380px at 100% 8%,rgba(255,214,236,.5),transparent),radial-gradient(700px 500px at 50% 100%,rgba(205,245,230,.5),transparent);background-size:24px 24px,24px 24px,auto,auto,auto;font:400 16px/1.6 'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;min-height:100vh}
main{max-width:540px;margin:0 auto;padding:16px 16px 40px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.pm{margin:0;font:500 12px var(--mo);color:var(--ac)}
h1{margin:0;font-size:25px;font-weight:700;line-height:1.35}
.lvl{font:700 13px var(--mo);border:1px solid var(--ac);color:var(--ac);border-radius:6px;padding:4px 10px;white-space:nowrap}
.hero{display:flex;gap:18px;align-items:center;background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:18px}
.ringw{position:relative;width:128px;height:128px;flex:none}
.ringw svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringw circle{fill:none;stroke-width:9}
.tr{stroke:var(--ln)}
.pg{stroke:var(--ac);stroke-dasharray:339.29;stroke-dashoffset:339.29;transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1);filter:var(--gl)}
.pg.full{stroke:var(--ok)}
.rc{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;direction:ltr;font-family:var(--mo)}
.rc b{font-size:34px;font-weight:700}.rc span{font-size:14px;color:var(--mu);margin-left:2px}
.hs{flex:1;min-width:0}
#msg{margin:0 0 10px;font-weight:600;font-size:15px;line-height:1.5}
.stats{display:flex;gap:20px;margin-bottom:12px}
.stats b{display:block;font:700 22px/1.1 var(--mo)}.stats span{font-size:12px;color:var(--mu)}
.xp{height:6px;background:var(--ln);border-radius:2px;overflow:hidden}
.xp i{display:block;height:100%;width:0;background:var(--ac);transition:width .6s}
#xpt{display:block;margin-top:6px;color:var(--mu);font:500 11px var(--mo);direction:ltr;text-align:right}
.add{margin:16px 0 4px;display:flex;flex-wrap:wrap;gap:8px}
.add input,.as input{font:inherit;font-size:16px;color:var(--tx);background:var(--pn);border:1.5px solid var(--ln);border-radius:8px;padding:12px 14px;outline:none;min-width:0}
.add input{flex:1 1 100%}
.add input:focus,.as input:focus{border-color:var(--ac)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#pb{height:48px;padding:0 16px;border-radius:8px;background:var(--pn);border:1.5px solid var(--ln);font-size:14px;font-weight:600}
#pb.p1{color:var(--wn);border-color:var(--wn)}#pb.p2{color:var(--cr);border-color:var(--cr)}
#ad{flex:1;height:48px;border-radius:8px;background:var(--ac);color:var(--on);font-weight:700}
#ad:active{transform:scale(.98)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;width:100%}
.chips button{flex:none;padding:5px 12px;border-radius:6px;border:1px dashed var(--mu);font-size:13px;color:var(--mu)}
.chips button:active{border-color:var(--ac);color:var(--ac)}
.pj{background:var(--pn);border:1px solid var(--ln);border-inline-start:3px solid var(--ac);border-radius:8px;margin-top:10px;padding:12px 14px}
.pj.p1{border-inline-start-color:var(--wn)}.pj.p2{border-inline-start-color:var(--cr)}
.pj.dn{border-inline-start-color:var(--ok);opacity:.65}
.ph{display:flex;align-items:center;gap:10px}
.ti{flex:1;min-width:0;text-align:start}
.ti span{display:block;font-weight:600;overflow-wrap:anywhere}
.ti em{font:500 12px var(--mo);font-style:normal;color:var(--mu)}
.p1 .ti em{color:var(--wn)}.p2 .ti em{color:var(--cr)}
.cv{color:var(--mu);font-size:14px}
.seg{display:flex;gap:3px;margin-top:10px}
.seg i{flex:1;height:6px;background:var(--ln);border-radius:1px}
.seg i.on{background:var(--ac)}.dn .seg i.on{background:var(--ok)}
.bd{margin-top:8px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px dashed var(--ln)}
li span{flex:1;min-width:0;overflow-wrap:anywhere}
li.d span{color:var(--mu);text-decoration:line-through}
.ck{width:26px;height:26px;flex:none;border-radius:6px;border:2px solid var(--mu);color:transparent;font-size:14px;font-weight:700;transition:.15s}
li.d .ck,.dn>.ph .ck{background:var(--ok);border-color:var(--ok);color:var(--on)}
.x{width:30px;height:30px;color:var(--mu);font-size:20px;line-height:1}
.as{display:flex;gap:8px;margin-top:6px}.as input{flex:1;padding:10px 12px;font-size:15px}
.as button{width:44px;border-radius:8px;background:var(--ac);color:var(--on);font:700 20px var(--mo)}
.rm{margin-top:10px;font-size:13px;color:var(--mu)}.rm.arm{color:var(--cr);font-weight:600}
.empty{text-align:center;color:var(--mu);padding:26px 10px}
h2{font-size:15px;margin:24px 0 10px}
#bars{display:flex;gap:8px;align-items:flex-end;height:110px;background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:12px 12px 8px}
#bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--mu);gap:4px}
#bars div span:first-child{font-family:var(--mo)}
#bars i{display:block;width:100%;max-width:26px;background:var(--ln);border-radius:2px;min-height:4px}
#bars div.t i{background:var(--ac)}
#nm{position:fixed;inset:0;background:var(--bg);z-index:8;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:30px;max-width:540px;margin:0 auto}
#nm[hidden]{display:none}
#nm h1{font-size:32px}#nm p{margin:0;color:var(--mu)}
#nm input{font:inherit;font-size:18px;color:var(--tx);background:var(--pn);border:1.5px solid var(--ln);border-radius:8px;padding:14px 16px}
#go{height:52px;border-radius:8px;background:var(--ac);color:var(--on);font-weight:700}
#cv{position:fixed;inset:0;pointer-events:none;z-index:9}
#ts{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;background:var(--tx);color:var(--bg);padding:9px 18px;border-radius:6px;font-weight:600;font-size:14px;transition:.3s;z-index:10;pointer-events:none;white-space:nowrap}
#ts.on{opacity:1;transform:translate(-50%,0)}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:14px}
.fc{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#tm{font:700 40px/1 var(--mo);direction:ltr}
.fc .chips{width:auto;padding:0}
.chips button.on{background:var(--tx);color:var(--bg);border:1px solid var(--tx)}
#fgo{margin-inline-start:auto;height:44px;padding:0 20px;border-radius:8px;background:var(--ac);color:var(--on);font-weight:700}
.mo{font:700 13px var(--mo);color:var(--wn)}
.hr{display:flex;align-items:center;gap:12px;background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.hm{flex:1;min-width:0}.hm .seg{margin-top:6px}.hm .seg i{height:5px}
.hr.d .ck{background:var(--ok);border-color:var(--ok);color:var(--on)}
.x.a{color:var(--cr);font-weight:700}
.bgs{display:flex;flex-wrap:wrap;gap:8px}
.bg{font-size:13px;padding:5px 12px;border-radius:6px;border:1px solid var(--ln);color:var(--mu)}
.bg.on{border-color:var(--ac);color:var(--ac)}
.hero,.card,.pj{border-radius:3px;box-shadow:inset 0 1px 0 #fff,0 6px 18px rgba(20,40,70,.07)}
.hero,.card{position:relative}
.hero::before,.card::before,.hero::after,.card::after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--ac)}
.hero::before,.card::before{top:-2px;left:-2px;border-right:0;border-bottom:0}
.hero::after,.card::after{bottom:-2px;right:-2px;border-left:0;border-top:0}
.add input,.as input,#pb,#ad,#go,#fgo,.as button,#nm input,.hr,.chips button,.bg,.lvl,#bars,.ck{border-radius:3px}
.seg i,.xp,.xp i{border-radius:0}
.seg i{height:7px}
.ringw circle{stroke-width:8}
.ringw .tk{stroke-width:2;stroke:var(--mu);opacity:.55;stroke-dasharray:1.5 4.29}
h2{display:flex;align-items:center;gap:8px;font:700 12px var(--mo);color:var(--ac);margin:26px 0 10px}
h2::before{content:"//"}
h2::after{content:"";flex:1;height:1px;background:var(--ln)}
.pm{display:flex;align-items:center;gap:8px}
.dot{width:7px;height:7px;background:var(--ok);border-radius:50%;animation:bl 1.6s infinite}
@keyframes bl{50%{opacity:.25}}
#clk{color:var(--mu)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main>
<header><div><p class="pm" dir="ltr"><i class="dot"></i>sys.online<span id="clk"></span></p><h1 id="nmh"></h1></div><div class="lvl" id="lvl"></div></header>
<section class="hero">
<div class="ringw"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="tk" cx="60" cy="60" r="59"/><circle class="tr" cx="60" cy="60" r="54"/><circle id="pr" class="pg" cx="60" cy="60" r="54"/></svg><div class="rc"><b id="pct">0</b><span>%</span></div></div>
<div class="hs"><p id="msg"></p>
<div class="stats"><div><b id="stk">0</b><span>يوم متتالي</span></div><div><b id="dn">0</b><span>خطوة اليوم</span></div></div>
<div class="xp"><i id="xpb"></i></div><span id="xpt"></span></div>
</section>
<section class="add">
<input id="in" dir="auto" placeholder="مهمة جديدة، مثال: تنفيذ نظام SAS" enterkeyhint="done" autocomplete="off" maxlength="120">
<button id="pb" aria-label="تغيير الأولوية">عادية</button>
<button id="ad">إضافة مهمة</button>
<div id="tp" class="chips"></div>
</section>
<section id="ls"></section>
<section><h2>جلسة تركيز</h2><div class="card fc"><div id="tm">25:00</div><div id="fdur" class="chips"></div><button id="fgo">ابدأ الجلسة</button><span class="mo" id="fdt"></span></div></section>
<section><h2>عاداتي اليومية</h2><div id="hb"></div><div class="as"><input id="hin" dir="auto" placeholder="عادة جديدة، مثال: رياضة" enterkeyhint="done" maxlength="60"><button id="hadd" aria-label="إضافة عادة">+</button></div><div id="hsug" class="chips"></div></section>
<section><h2>أوسمتك</h2><div id="bdg" class="bgs"></div></section>
<section><h2>أسبوعك</h2><div id="bars"></div></section>
</main>
<div id="nm" hidden><h1>أهلاً فيك</h1><p>وش تحب أناديك؟</p><input id="ni" placeholder="اسمك" autocomplete="off"><button id="go">ابدأ</button></div>
<canvas id="cv"></canvas><div id="ts" role="status"></div>
<script>
(function(){
var $=function(s){return document.querySelector(s)},DAYS=['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'],PR=['عادية','عالية','حرجة'];
var TPL=[{n:'نشر نظام جديد',s:['تحديد المنافذ المطلوبة وفتحها','ضبط قواعد الجدار الناري (أقل صلاحية)','إنشاء الحسابات وتحديد الصلاحيات','تفعيل السجلات والمراقبة','أخذ نسخة احتياطية قبل التغيير','اختبار القبول والتحقق','توثيق التغيير والتسليم']},
{n:'Hardening لنظام',s:['تحديث النظام والتصحيحات','تعطيل الخدمات والمنافذ غير الضرورية','تقوية إعدادات SSH والوصول عن بعد','تفعيل المصادقة متعددة العوامل','ضبط سياسة كلمات المرور','مراجعة الحسابات الخاملة والصلاحيات','فحص الثغرات وتسجيل النتائج']},
{n:'مراجعة أمنية',s:['جرد الأصول','مراجعة قواعد الجدار الناري','مراجعة السجلات والتنبيهات','اختبار استعادة النسخ الاحتياطية','رفع تقرير الملاحظات']}];
var S={name:'',proj:[],xp:0,log:{},habits:[],fl:{}},pri=0,focusId=null,armed=null,toastT,fDur=25,fEnd=0,fTick=null,ah=null;
try{var r=localStorage.getItem('injaz.v2');if(r)S=Object.assign(S,JSON.parse(r));else{var o=localStorage.getItem('injaz.v1');if(o){o=JSON.parse(o);S.name=o.name||'';S.xp=o.xp||0;S.log=o.log||{};S.proj=(o.tasks||[]).map(function(k){return{id:k.id,t:k.t,p:k.s?1:0,open:false,subs:[],done:!!k.done,day:k.day,pts:k.pts}})}}}catch(e){}
function save(){try{localStorage.setItem('injaz.v2',JSON.stringify(S))}catch(e){}}
function dk(d){d=d||new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function find(id){return S.proj.filter(function(p){return p.id===id})[0]}
function lvl(){return Math.floor(S.xp/100)}
function gain(n){var a=lvl();S.xp=Math.max(0,S.xp+n);return lvl()>a}
function logn(d,n){S.log[d]=Math.max(0,(S.log[d]||0)+n)}
function streak(){var d=new Date(),n=0;if(!(S.log[dk(d)]>0))d.setDate(d.getDate()-1);while(S.log[dk(d)]>0){n++;d.setDate(d.getDate()-1)}return n}
function toast(t){var e=$('#ts');e.textContent=t;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){e.classList.remove('on')},2000)}
function boom(n){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;var c=$('#cv'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;var cols=['#0A57D6','#0C9A62','#E08A00','#7A5CFF'],P=[];for(var i=0;i<n;i++)P.push({x:innerWidth/2,y:innerHeight*.4,vx:(Math.random()-.5)*13,vy:-Math.random()*11-3,s:Math.random()*6+4,c:cols[Math.random()*4|0],r:Math.random()*6});var f=0;(function a(){x.clearRect(0,0,c.width,c.height);P.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.r+=.2;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillRect(-p.s/2,-p.s/2,p.s,p.s);x.restore()});if(++f<85)requestAnimationFrame(a);else x.clearRect(0,0,c.width,c.height)})()}
function fb(up,full,txt){if(up){toast('ترقية! المستوى '+(lvl()+1));boom(120)}else if(full){toast('اكتملت المهمة  '+txt);boom(100)}else{toast(txt);boom(28)}}
function pdone(p,f){if(f&&!p.done){p.done=true;p.day=dk();p.pts=15+10*p.p;var up=gain(p.pts);if(!p.subs.length)logn(p.day,1);return up?2:1}if(!f&&p.done){p.done=false;gain(-(p.pts||15));if(!p.subs.length)logn(p.day,-1)}return 0}
function tsub(p,s){var up=false,full=false;if(!s.done){s.done=true;s.day=dk();up=gain(5);logn(s.day,1);if(p.subs.every(function(z){return z.done})){up=pdone(p,true)===2||up;full=true}}else{s.done=false;gain(-5);logn(s.day,-1);pdone(p,false)}save();render();if(s.done)fb(up,full,'+5 XP')}
function tproj(p){if(!p.done){var r=pdone(p,true);save();render();fb(r===2,true,'+'+p.pts+' XP')}else{pdone(p,false);save();render()}}
function asub(id){var p=find(id),i=document.querySelector('input[data-a="'+id+'"]'),v=i&&i.value.trim();if(!p||!v)return;pdone(p,false);p.subs.push({id:uid(),t:v,done:false});focusId=id;save();render()}
function addp(title,subs){var v=title||$('#in').value.trim();if(!v)return;var p={id:uid(),t:v,p:pri,open:true,subs:(subs||[]).map(function(t){return{id:uid(),t:t,done:false}}),done:false};S.proj.push(p);$('#in').value='';focusId=subs?null:p.id;save();render()}
var HS=['رياضة','قراءة','نوم مبكر','مراجعة السجلات'];
function hstreak(h){var d=new Date(),n=0;if(!h.days[dk(d)])d.setDate(d.getDate()-1);while(h.days[dk(d)]){n++;d.setDate(d.getDate()-1)}return n}
function thab(id){var h=S.habits.filter(function(x){return x.id===id})[0];if(!h)return;var t=dk();if(!h.days[t]){h.days[t]=1;var up=gain(5);logn(t,1);save();render();fb(up,false,'+5 XP')}else{delete h.days[t];gain(-5);logn(t,-1);save();render()}}
function addh(v){v=(v||$('#hin').value).trim();if(!v)return;S.habits.push({id:uid(),t:v,days:{}});$('#hin').value='';save();render()}
function fshow(){var s=fEnd?Math.max(0,Math.ceil((fEnd-Date.now())/1000)):fDur*60;$('#tm').textContent=('0'+Math.floor(s/60)).slice(-2)+':'+('0'+s%60).slice(-2)}
function ftick(){if(!fEnd)return;if(Date.now()<fEnd){fshow();return}fEnd=0;clearInterval(fTick);var t=dk(),up;S.fl[t]=(S.fl[t]||0)+1;up=gain(15);logn(t,1);save();render();toast(up?'ترقية! المستوى '+(lvl()+1):'انتهت الجلسة  +15 XP');boom(up?120:70)}
function fgo(){if(fEnd){fEnd=0;clearInterval(fTick)}else{fEnd=Date.now()+fDur*60000;fTick=setInterval(ftick,500)}render()}
function rh(){var t=dk();
$('#hb').innerHTML=S.habits.length?S.habits.map(function(h){var g='';for(var i=6;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);g+='<i class="'+(h.days[dk(d)]?'on':'')+'"></i>'}return'<div class="hr'+(h.days[t]?' d':'')+'"><button class="ck" data-h="'+h.id+'" aria-label="تم">✓</button><div class="hm"><span dir="auto">'+esc(h.t)+'</span><div class="seg">'+g+'</div></div><span class="mo">'+hstreak(h)+'🔥</span><button class="x'+(ah===h.id?' a':'')+'" data-hx="'+h.id+'" aria-label="حذف العادة">'+(ah===h.id?'؟':'×')+'</button></div>'}).join(''):'<div class="empty">العادات تتكرر كل يوم. اختر من الاقتراحات أو اكتب عادتك.</div>';
$('#hsug').innerHTML=HS.filter(function(x){return!S.habits.some(function(h){return h.t===x})}).map(function(x){return'<button data-s="'+x+'">+ '+x+'</button>'}).join('');
$('#fgo').textContent=fEnd?'إيقاف':'ابدأ الجلسة';$('#fdt').textContent='اليوم: '+(S.fl[t]||0);fshow();
$('#fdur').innerHTML=[15,25,45].map(function(m){return'<button data-m="'+m+'" class="'+(m===fDur?'on':'')+'">'+m+' د</button>'}).join('');
var tot=0,fs=0,bs=0,k,sk=streak();for(k in S.log)tot+=S.log[k];for(k in S.fl)fs+=S.fl[k];S.habits.forEach(function(h){bs=Math.max(bs,hstreak(h))});
var B=[['أول إنجاز',tot>=1],['10 إنجازات',tot>=10],['50 إنجاز',tot>=50],['3 أيام متتالية',sk>=3],['أسبوع متتالي',sk>=7],['أول جلسة تركيز',fs>=1],['5 جلسات تركيز',fs>=5],['عادة 7 أيام',bs>=7],['المستوى 5',lvl()>=4]];
$('#bdg').innerHTML=B.map(function(b){return'<span class="bg'+(b[1]?' on':'')+'">'+(b[1]?'★ ':'🔒 ')+b[0]+'</span>'}).join('');
var c=B.filter(function(b){return b[1]}).length;if(S.bc!=null&&c>S.bc)setTimeout(function(){toast('وسام جديد 🏅')},2200);S.bc=c}
function render(){
var t=dk(),V=S.proj.filter(function(p){return!p.done||p.day===t}),it=0,dn=0;
V.forEach(function(p){if(p.subs.length){it+=p.subs.length;dn+=p.subs.filter(function(s){return s.done}).length}else{it++;dn+=p.done?1:0}});
var pct=it?Math.round(dn/it*100):0,into=S.xp%100,left=it-dn;
$('#nmh').textContent=S.name?'مرحباً '+S.name:'';
$('#lvl').textContent='LV '+(lvl()+1);
$('#pct').textContent=pct;
var pr=$('#pr');pr.style.strokeDashoffset=339.29*(1-pct/100);pr.classList.toggle('full',pct===100&&it>0);
$('#stk').textContent=streak();$('#dn').textContent=S.log[t]||0;
$('#xpb').style.width=into+'%';$('#xpt').textContent='XP '+into+'/100';
$('#msg').textContent=!it?'ما في مهام. أضف أول مهمة وابدأ':pct===100?'كل شي منجز. النظام نظيف!':dn===0?'باقي '+left+' خطوة. ابدأ بأسهلها':pct<50?'بداية ممتازة، كمّل':'قربت، باقي '+left;
$('#pb').textContent=PR[pri];$('#pb').className='p'+pri;
$('#tp').innerHTML=TPL.map(function(x,i){return'<button data-t="'+i+'">+ '+x.n+'</button>'}).join('');
V.sort(function(a,b){return(a.done-b.done)||(b.p-a.p)});
$('#ls').innerHTML=V.length?V.map(function(p){var n=p.subs.length,d=p.subs.filter(function(s){return s.done}).length,
seg=n?p.subs.map(function(s){return'<i class="'+(s.done?'on':'')+'"></i>'}).join(''):'<i class="'+(p.done?'on':'')+'"></i>',
body=p.open?'<div class="bd"><ul>'+p.subs.map(function(s){return'<li class="'+(s.done?'d':'')+'"><button class="ck" data-act="cs" data-id="'+p.id+'" data-s="'+s.id+'" aria-label="تم">✓</button><span dir="auto">'+esc(s.t)+'</span><button class="x" data-act="xs" data-id="'+p.id+'" data-s="'+s.id+'" aria-label="حذف">×</button></li>'}).join('')+'</ul><div class="as"><input data-a="'+p.id+'" dir="auto" placeholder="خطوة جديدة، مثال: فتح المنافذ المطلوبة" enterkeyhint="done" maxlength="120"><button data-act="as" data-id="'+p.id+'" aria-label="إضافة خطوة">+</button></div><button class="rm'+(armed===p.id?' arm':'')+'" data-act="xp" data-id="'+p.id+'">'+(armed===p.id?'اضغط مرة ثانية للتأكيد':'حذف المهمة')+'</button></div>':'';
return'<article class="pj p'+p.p+(p.done?' dn':'')+'"><div class="ph">'+(n?'':'<button class="ck" data-act="ck" data-id="'+p.id+'" aria-label="تم">✓</button>')+'<button class="ti" data-act="tp" data-id="'+p.id+'" aria-expanded="'+!!p.open+'"><span dir="auto">'+esc(p.t)+'</span><em>'+PR[p.p]+(n?' · '+d+'/'+n:'')+' · #'+p.id.slice(-4).toUpperCase()+'</em></button><span class="cv" aria-hidden="true">'+(p.open?'▾':'◂')+'</span></div><div class="seg">'+seg+'</div>'+body+'</article>'}).join(''):'<div class="empty">اكتب اسم المهمة فوق، أو ابدأ من قالب جاهز، وبعدها أضف خطواتها.</div>';
var b='';for(var i=6;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);var n=S.log[dk(d)]||0;b+='<div class="'+(i===0?'t':'')+'"><span>'+n+'</span><i style="height:'+Math.min(100,n*14+4)+'%"></i><span>'+DAYS[d.getDay()]+'</span></div>'}
$('#bars').innerHTML=b;
rh();$('#nm').hidden=!!S.name;
if(focusId){var e=document.querySelector('input[data-a="'+focusId+'"]');if(e)e.focus();focusId=null}
}
$('#ad').onclick=function(){addp()};
$('#in').onkeydown=function(e){if(e.key==='Enter')addp()};
$('#pb').onclick=function(){pri=(pri+1)%3;render()};
$('#tp').onclick=function(e){var i=e.target.dataset.t;if(i!=null){var x=TPL[i];addp($('#in').value.trim()||x.n,x.s)}};
$('#ls').onclick=function(e){var b=e.target.closest('button');if(!b)return;var a=b.dataset.act,p=find(b.dataset.id);if(!p)return;if(a!=='xp')armed=null;
if(a==='tp'){p.open=!p.open;save();render()}
else if(a==='ck')tproj(p);
else if(a==='cs'){var s=p.subs.filter(function(z){return z.id===b.dataset.s})[0];if(s)tsub(p,s)}
else if(a==='xs'){var s2=p.subs.filter(function(z){return z.id===b.dataset.s})[0];if(s2&&s2.done){gain(-5);logn(s2.day,-1)}p.subs=p.subs.filter(function(z){return z.id!==b.dataset.s});save();render()}
else if(a==='as')asub(p.id);
else if(a==='xp'){if(armed===p.id){S.proj=S.proj.filter(function(z){return z.id!==p.id});armed=null;save()}else armed=p.id;render()}};
$('#ls').onkeydown=function(e){if(e.key==='Enter'&&e.target.dataset.a)asub(e.target.dataset.a)};
$('#fdur').onclick=function(e){var m=+e.target.dataset.m;if(m&&!fEnd){fDur=m;render()}};
$('#fgo').onclick=fgo;
$('#hadd').onclick=function(){addh()};
$('#hin').onkeydown=function(e){if(e.key==='Enter')addh()};
$('#hsug').onclick=function(e){var v=e.target.dataset.s;if(v)addh(v)};
$('#hb').onclick=function(e){var b=e.target.closest('button');if(!b)return;if(b.dataset.h)thab(b.dataset.h);else if(b.dataset.hx){var id=b.dataset.hx;if(ah===id){S.habits=S.habits.filter(function(x){return x.id!==id});ah=null;save()}else ah=id;render()}};
document.addEventListener('visibilitychange',ftick);
function clk(){var d=new Date();$('#clk').textContent=[d.getHours(),d.getMinutes(),d.getSeconds()].map(function(n){return('0'+n).slice(-2)}).join(':')}clk();setInterval(clk,1000);
$('#go').onclick=function(){var v=$('#ni').value.trim();if(v){S.name=v;save();render()}};
$('#ni').onkeydown=function(e){if(e.key==='Enter')$('#go').click()};
render();
})();
